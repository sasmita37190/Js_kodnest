<!-- ----------------------------------------
 DOM = Document Object Model
--------------------------------------------------


When a browser loads an HTML page, it converts the HTML into a tree-like structure of objects.

JavaScript uses the DOM to:

Find HTML elements
Change HTML content
Change CSS
Add/remove elements
Handle button clicks and other events

Example:

The browser creates something like:

Document
   |
   HTML
   |
   Body
   |
   ├── h1
   │    └── "Hello"
   |
   └── button
        └── "Click Me" -->

        //JavaScript can access and modify these elements.
