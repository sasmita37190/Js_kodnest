Topic 6 — setAttribute()-Change an Attribute

Remember
getAttribute()

→ GET/read

setAttribute()

→ SET/change



etAttribute() vs setAttribute()
Method	         Purpose	      Example
getAttribute()	 Get/read	      title.getAttribute("class")
setAttribute()	 Change/set	       title.setAttribute("class", "test")

----------------------------------------------------------------------------------------------------------------------------
Easy memory trick:
GET
 ↓
Read

SET
 ↓
Change

So:

title.getAttribute("class")

means:

What is the current class?

And:

title.setAttribute("class", "test")

means:

Make the class "test".

One important difference from .className

You can also do:

title.className

to read the class.

And:

title.className = "test"

to change it.

But getAttribute() / setAttribute() work with many different HTML attributes, not just class.

So for your notes, remember:

getAttribute() → Read attribute
setAttribute() → Change/Add attribute
That is the cleanest version for Topic 6.

------------------------------------


In DOM, NodeList and HTMLCollection are both collections that contain multiple HTML elements. The main difference is how you get them and what methods they support.

1. NodeList

A NodeList is a collection of nodes returned by methods like:

document.querySelectorAll()
Example

HTML:

<li>Apple</li>
<li>Banana</li>
<li>Mango</li>

JavaScript:

const list = document.querySelectorAll("li");

Now:

list

You get something like:

NodeList(3) [li, li, li]

That means:

list
 ↓
NodeList
 ├── li → Apple   [0]
 ├── li → Banana  [1]
 └── li → Mango   [2]

You can access them:

list[0]
list[1]
list[2]

And you can use:

list.forEach(function(li) {
    li.style.color = "green";
});
2. HTMLCollection

An HTMLCollection is also a collection of HTML elements.

It is commonly returned by:

document.getElementsByClassName()

and:

document.getElementsByTagName()
Example

HTML:

<li class="list-item">Apple</li>
<li class="list-item">Banana</li>
<li class="list-item">Mango</li>

JavaScript:

const list = document.getElementsByClassName("list-item");

Now:

list

You get:

HTMLCollection(3) [li.list-item, li.list-item, li.list-item]

Think:

list
 ↓
HTMLCollection
 ├── li → Apple   [0]
 ├── li → Banana  [1]
 └── li → Mango   [2]

You can access:

list[0]
list[1]
list[2]
3. Main difference ⭐
	NodeList	HTMLCollection
Common method	querySelectorAll()	getElementsByClassName()
Contains	Nodes	HTML elements
Indexing [0]	✅	✅
.length	✅	✅
forEach()	✅	⚠️ Don't rely on it; use a loop or convert to Array
Example	NodeList(3)	HTMLCollection(3)
4. Your examples

You previously did:

const tempLiList = document.querySelectorAll("li");

You got:

NodeList(3)

So:

querySelectorAll()
        ↓
    NodeList

Then you did:

const tempClassList =
    document.getElementsByClassName("list-item");

You got:

HTMLCollection(3)

So:

getElementsByClassName()
        ↓
  HTMLCollection
5. Why did forEach() work with NodeList?

You can do:

const list = document.querySelectorAll("li");

list.forEach(function(li) {
    li.style.color = "green";
});

Because the NodeList returned by querySelectorAll() supports forEach().

With an HTMLCollection, the safer approach is:

const list = document.getElementsByClassName("list-item");

for (let i = 0; i < list.length; i++) {
    list[i].style.color = "green";
}

Or convert it:

Array.from(list).forEach(function(li) {
    li.style.color = "green";
});
🧠 Easy way to remember
NodeList
document.querySelectorAll("li")

↓

NodeList
HTMLCollection
document.getElementsByClassName("list-item")

↓

HTMLCollection

Both are collections of multiple elements, and both support:

list[0]
list[1]
list.length

The biggest thing for your current DOM learning is:

querySelectorAll() → NodeList
getElementsByClassName() → HTMLCollection

That's enough to remember for now.
